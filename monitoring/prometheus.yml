global:
  scrape_interval: 60s
  evaluation_interval: 60s
  scrape_timeout: 15s

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: nginx-exporter
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']