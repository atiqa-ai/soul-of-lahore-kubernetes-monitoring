# =============================================================================
# Soul of Lahore - Docker Compose stack
#
# Services:
#   - soul-of-lahore : the Next.js app (production build, non-root)
#   - nginx          : reverse proxy (gzip, static caching, keep-alive)
#   - prometheus     : metrics collection
#   - grafana        : monitoring dashboards (Prometheus + Loki)
#   - loki           : log storage
#   - promtail       : ships container logs to Loki
#   - cadvisor       : per-container resource metrics
#   - nginx-exporter : nginx request metrics for Prometheus
#
# Auto-start behaviour:
#   restart: unless-stopped keeps the containers running whenever the Docker
#   engine is up. On a laptop, enable "Start Docker Desktop when you sign in"
#   (Settings > General) so the stack comes back automatically after a reboot.
#
# Usage (from the project root):
#   ./build.sh  |  .\build.ps1   -> build the image
#   ./start.sh  |  .\start.ps1   -> start the stack
#   ./stop.sh   |  .\stop.ps1    -> stop the stack
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # The Soul of Lahore application (behind nginx, not exposed to the host)
  # ---------------------------------------------------------------------------
  soul-of-lahore:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # NEXT_PUBLIC_* keys are baked into the client bundle at build time.
        # They are read from .env.local (the scripts pass it as --env-file).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: soul-of-lahore:latest
    container_name: soul-of-lahore
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          memory: 256M
          cpus: "0.25"
        limits:
          memory: 2G
          cpus: "4.0"
    networks:
      - sol-net

  # ---------------------------------------------------------------------------
  # Reverse proxy + performance layer (gzip, static caching, keep-alive)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      soul-of-lahore:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        reservations:
          memory: 64M
          cpus: "0.10"
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sol-net

  # ---------------------------------------------------------------------------
  # Pushes nginx stub_status metrics into Prometheus
  # ---------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    depends_on:
      - nginx
    logging: *default-logging
    deploy:
      resources:
        reservations:
          memory: 16M
          cpus: "0.05"
        limits:
          memory: 64M
          cpus: "0.25"
    networks:
      - sol-net

  # ---------------------------------------------------------------------------
  # Prometheus - time-series collection & rules
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      - cadvisor
      - nginx-exporter
    logging: *default-logging
    deploy:
      resources:
        reservations:
          memory: 128M
          cpus: "0.10"
        limits:
          memory: 512M
          cpus: "0.75"
    networks:
      - sol-net

  # ---------------------------------------------------------------------------
  # Grafana - dashboards (Prometheus + Loki datasources preconfigured)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.16
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    logging: *default-logging
    deploy:
      resources:
        reservations:
          memory: 128M
          cpus: "0.10"
        limits:
          memory: 512M
          cpus: "0.75"
    networks:
      - sol-net

  # ---------------------------------------------------------------------------
  # Loki - log aggregation backend
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    logging: *default-logging
    deploy:
      resources:
        reservations:
          memory: 128M
          cpus: "0.10"
        limits:
          memory: 512M
          cpus: "0.75"
    networks:
      - sol-net

  # ---------------------------------------------------------------------------
  # Promtail - ships all container logs to Loki
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.2.2
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    logging: *default-logging
    deploy:
      resources:
        reservations:
          memory: 64M
          cpus: "0.05"
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sol-net

  # ---------------------------------------------------------------------------
  # cAdvisor - per-container resource metrics (CPU/mem/network) for Prometheus
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --global_housekeeping_interval=5m
      - --docker_only=true
    logging: *default-logging
    deploy:
      resources:
        reservations:
          memory: 128M
          cpus: "0.10"
        limits:
          memory: 512M
          cpus: "0.75"
    networks:
      - sol-net

networks:
  sol-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data: