# =============================================================================
# Soul of Lahore - Nginx reverse proxy
#
# Sits in front of the Next.js standalone server (soul-of-lahore:3000).
# Responsibilities:
#   - Gzip compression (HTML, JS, CSS, JSON, SVG, fonts)
#   - Long-lived immutable caching for /_next/static (fingerprinted assets)
#   - Keep-alive upstream connections for lower latency
#   - stub_status endpoint for the nginx-prometheus-exporter
# =============================================================================

upstream soul_of_lahore {
    server soul-of-lahore:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- I/O tuning ---------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # --- gzip ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml
        application/x-font-ttf
        application/vnd.ms-fontobject
        application/x-font-opentype
        font/woff
        font/woff2;

    client_max_body_size 4m;

    # --- nginx metrics for the prometheus exporter --------------------------
    location = /stub_status {
        stub_status;
        allow 172.0.0.0/8;
        allow 10.0.0.0/8;
        deny all;
    }

    # --- Next.js fingerprinted static assets: cache forever -----------------
    location /_next/static/ {
        proxy_pass http://soul_of_lahore;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache "$upstream_cache_status";
        open_file_cache max=1000 inactive=5m;
        open_file_cache_valid 2m;
        open_file_cache_errors on;
    }

    # --- media / images: cache 1 day, gzip -----------------------------------
    location /images/ {
        proxy_pass http://soul_of_lahore;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public";
    }

    # --- API routes ----------------------------------------------------------
    location /api/ {
        proxy_pass http://soul_of_lahore;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # --- everything else ------------------------------------------------------
    location / {
        proxy_pass http://soul_of_lahore;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }
}